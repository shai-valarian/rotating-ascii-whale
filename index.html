<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f111a">
  <meta name="description" content="A blue whale, spinning in 3D ASCII.">
  <title>Rotating Whale</title>
  <style>
    :root { color-scheme: dark; background: #0f111a; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f111a; }
    body { min-height: 100dvh; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    canvas:focus { outline: none; }
    canvas:focus-visible { outline: 1px solid #69accb; outline-offset: -2px; }
  </style>
  <script src="./whale.js" defer></script>
</head>
<body>
  <canvas id="whale" role="img" tabindex="0" aria-label="A blue whale rotating in three-dimensional ASCII art. Click, tap, or press Space to pause or resume."></canvas>
</body>
</html>
